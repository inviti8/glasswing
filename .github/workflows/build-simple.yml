name: Build Simple Cross-Platform

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: |
        uv python install 3.11

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y           imagemagick libmagickwand-dev           libexiv2-27 libexiv2-dev           libxcb-xinerama0 libxcb-cursor0           libwebkit2gtk-4.0-37           python3-pyqt5           python3-pyqt5.qtwebengine           python3-pyqt5.qtwebchannel           libqt5webenginecore5           libqt5webenginewidgets5           libqt5gui5           libqt5widgets5

    - name: Install Python dependencies
      run: |
        uv sync
        uv add --dev pyinstaller pillow

    - name: Ensure pywebview[qt] for Linux
      run: |
        uv add pywebview[qt]

    - name: Verify media dependencies
      run: |
        uv run python -c "import biscuit_auth; import nacl; import hvym_stellar; import aiposematic; print('Media deps OK')"

    - name: Generate icons
      run: uv run python scripts/generate_icons.py

    - name: Verify media features
      run: uv run python scripts/verify_audio_build.py

    - name: Build Linux executable
      run: uv run python scripts/build_cross_platform.py

    - name: Upload Linux build
      uses: actions/upload-artifact@v4
      with:
        name: andromica-linux
        path: build/dist/andromica
        retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: |
        uv python install 3.11

    - name: Install Python dependencies
      run: |
        uv sync
        uv add --dev pyinstaller pillow

    - name: Verify media dependencies
      run: |
        uv run python -c "import biscuit_auth; import nacl; import hvym_stellar; import aiposematic; print('Media deps OK')"

    - name: Generate icons
      run: uv run python scripts/generate_icons.py

    - name: Verify media features
      run: uv run python scripts/verify_audio_build.py

    - name: Build Windows executable
      run: uv run python scripts/build_cross_platform.py

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: andromica-windows
        path: build/dist/andromica.exe
        retention-days: 30

  build-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: |
        uv python install 3.11

    - name: Install system dependencies
      run: |
        brew install imagemagick

    - name: Install Python dependencies
      run: |
        uv sync
        uv add --dev pyinstaller pillow icnsutil

    - name: Verify media dependencies
      run: |
        uv run python -c "import biscuit_auth; import nacl; import hvym_stellar; import aiposematic; print('Media deps OK')"

    - name: Generate icons
      run: uv run python scripts/generate_icons.py

    - name: Verify media features
      run: uv run python scripts/verify_audio_build.py

    - name: Build macOS executable
      run: uv run python scripts/build_cross_platform.py

    - name: Create ZIP
      run: |
        cd build/dist
        zip -r andromica-macos.zip andromica.app

    - name: Upload macOS build
      uses: actions/upload-artifact@v4
      with:
        name: andromica-macos
        path: build/dist/andromica-macos.zip
        retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download all builds
      uses: actions/download-artifact@v4
      with:
        path: builds

    - name: Create release package
      run: |
        mkdir -p release
        cp builds/andromica-linux/andromica release/andromica-linux
        cp builds/andromica-windows/andromica.exe release/andromica-windows.exe
        cp builds/andromica-macos/*.zip release/

    - name: Create installation guide
      run: |
        cat > release/INSTALL.txt << 'EOF'
        # Andromica Installation Guide

        ## Prerequisites

        Andromica requires the following native tools to be installed:

        ### Windows
        1. ImageMagick: https://imagemagick.org/script/download.php#windows
           - Select 16-bit dynamic version
           - During installation, check "Add to PATH"
        2. ExifTool: https://exiftool.org/
           - Download and add to PATH
        3. Andomica Requires ipfs to work
        The Simplest option is:
        IPFS Desktop: https://docs.ipfs.tech/install/ipfs-desktop/

        Embedded ipfs options:
        ### macOS
        brew install imagemagick exiftool
        # Optional: brew install ipfs

        ### Linux (Ubuntu/Debian)
        sudo apt install imagemagick libmagickwand-dev exiftool libexiv2-27
        # Optional: sudo apt install ipfs

        ## Installation

        ### Linux
        chmod +x andromica-linux
        ./andromica-linux

        ### Windows
        Double-click andromica-windows.exe or run from command prompt.

        ### macOS
        1. Unzip andromica-macos.zip
        2. Move andromica.app to Applications
        3. Right-click and select "Open" (first time only, due to Gatekeeper)

        Note: This is an ARM (Apple Silicon) build. Intel Macs can run it
        via Rosetta 2, which macOS enables automatically.

        ## Notes

        - IPFS Features: Require IPFS daemon running at 127.0.0.1:5001
        - Font Licensing: OCR-A.ttf is copyrighted by Monotype (1994)

        For detailed documentation, see docs/INSTALL.md in the repository.
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        body_path: release/INSTALL.txt
      env:
        GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
